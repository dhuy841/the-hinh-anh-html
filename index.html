<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luyện tập thẻ hình ảnh</title>
</head>
<body>
    <h1>Trang web hiển thị hình ảnh</h1>

    <!-- 
      Thẻ <img> dùng để chèn hình ảnh:
      - src: Đường dẫn tới file ảnh local (vd: images/cat.jpg) hoặc link ảnh online.
      - alt: Đoạn văn bản mô tả hình ảnh (bắt buộc theo yêu cầu bài tập).
    -->
    <img src="https://picsum.photos/600/400" alt="Hình ảnh thiên nhiên minh họa">
</body>
</html>
